[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-grid-trading-bot"
version = "1.0.0"
description = "A grid trading bot for Binance that automatically places buy and sell orders at preset price intervals"
requires-python = ">=3.10"
dependencies = [
    "python-binance>=1.0.19",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
grid-bot = "grid_trading_bot.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
